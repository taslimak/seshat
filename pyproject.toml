[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat"
version = "0.1.0"
description = "Predict output-token usage for AI prompts before execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.9,<3.0",
  "scikit-learn>=1.5,<2.0",
  "tiktoken>=0.8,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
data = [
  "pyarrow>=25.0,<26.0",
  "pyyaml>=6.0,<7.0",
]
providers = [
  "anthropic>=1.13,<2.0",
  "openai>=3.28,<4.0",
  "google-genai>=2.29,<3.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.7,<1.0",
]

[project.scripts]
seshat-data = "seshat.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seshat = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# String/regex tables (feature definitions, prompt templates) read better unwrapped.
"src/seshat/data/features/extract.py" = ["E501"]
"src/seshat/data/generators/templates.py" = ["E501"]
"src/seshat/data/schemas/docs.py" = ["E501"]

[tool.mypy]
# No pinned python_version: numpy>=2.5 stubs need 3.12+ syntax, so each CI job
# type-checks against its own interpreter (3.11 and 3.13).
strict = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["pyarrow", "pyarrow.*", "yaml", "anthropic", "anthropic.*", "openai", "openai.*", "google", "google.*"]
ignore_missing_imports = true
