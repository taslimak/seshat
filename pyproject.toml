[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat"
version = "0.1.0"
description = "Predict output-token usage for AI prompts before execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "joblib>=1.4,<2.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.9,<3.0",
  "scikit-learn>=1.5,<2.0",
  "tiktoken>=0.8,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
data = [
  "pyarrow>=25.0,<26.0",
]
providers = [
  "anthropic>=1.8,<2.0",
  "openai>=3.13,<4.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.7,<1.0",
]

[project.scripts]
seshat-data = "seshat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seshat = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
