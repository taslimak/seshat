name: Manual calibration data batch

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "API provider (matching GitHub Actions secret required)"
        type: choice
        required: true
        options: [openai, anthropic, gemini]
      model:
        description: "Verified model from configs/model_catalog.json"
        type: string
        required: true
      config_path:
        description: "Optional reviewed batch config (configs/experiments/batches/*.yaml from plan-batch); empty = standard 180-request campaign"
        type: string
        default: ""
        required: false
      approve_paid_call:
        description: "Approve ONE paid batch; estimated spend hard-capped at $2.00"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: seshat-calibration-paid-batches
  cancel-in-progress: false

jobs:
  campaign:
    if: ${{ inputs.approve_paid_call == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SESHAT_PROVIDER: ${{ inputs.provider }}
      SESHAT_MODEL: ${{ inputs.model }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SESHAT_PROMPT_HASH_KEY: ${{ secrets.SESHAT_PROMPT_HASH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Ensure selected credential and hash key exist
        shell: bash
        run: |
          set -euo pipefail
          case "$SESHAT_PROVIDER" in
            openai) test -n "${OPENAI_API_KEY:-}" ;;
            anthropic) test -n "${ANTHROPIC_API_KEY:-}" ;;
            gemini) test -n "${GEMINI_API_KEY:-}" ;;
            *) exit 1 ;;
          esac || { echo "Missing API key"; exit 1; }
          test -n "${SESHAT_PROMPT_HASH_KEY:-}" || { echo "Missing hash key"; exit 1; }
      - name: Install Seshat
        run: python -m pip install -e ".[data,providers]"
      - name: Fetch shadow forecaster from the private store (runner-only, digest-checked)
        id: shadow
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          GH_TOKEN: ${{ secrets.SESHAT_STORE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ref=""
          if [ -n "$CONFIG_PATH" ]; then
            ref=$(python -c "import sys,yaml;c=yaml.safe_load(open(sys.argv[1].strip()));print((c.get('shadow') or {}).get('artifact_ref',''))" "$CONFIG_PATH")
          fi
          if [ -z "$ref" ]; then echo "path=" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Shadow evaluation required but SESHAT_STORE_READ_TOKEN is not configured; no paid request sent."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/shadow"   # outside data/, never uploaded
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/taslimak/seshat-data/contents/${ref}" > "$RUNNER_TEMP/shadow/forecaster.json"
          echo "path=$RUNNER_TEMP/shadow/forecaster.json" >> "$GITHUB_OUTPUT"
      - name: Build unique calibration batch
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          SHADOW_PATH: ${{ steps.shadow.outputs.path }}
        run: |
          if [ -n "$CONFIG_PATH" ]; then
            python -m scripts.use_batch_config --config "$CONFIG_PATH" \
              --provider "$SESHAT_PROVIDER" --model "$SESHAT_MODEL" \
              ${SHADOW_PATH:+--shadow-artifact "$SHADOW_PATH"} \
              --output data/calibration.yml
          else
            python -m scripts.prepare_calibration_campaign \
              --provider "$SESHAT_PROVIDER" --model "$SESHAT_MODEL" \
              --run-id "${{ github.run_id }}" --output data/calibration.yml
          fi
      - name: Cost estimate (no API dispatch)
        run: python -m seshat.data.cli collect --config data/calibration.yml --dry-run
      - name: Authorized real collection (budget-limited, $2 estimated hard cap)
        run: |
          python -m seshat.data.cli collect --config data/calibration.yml \
            --execute-live --max-cost-usd 2.00
      - name: Validate and export
        if: always()
        run: |
          python -m seshat.data.cli validate || true
          python -m seshat.data.cli export --format csv --limit 500 || true
          python -m seshat.data.cli stats > data/calibration_stats.json || true
      - name: Preserve collected records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seshat-calibration-${{ github.run_id }}
          path: data/
          retention-days: 30
          if-no-files-found: warn
