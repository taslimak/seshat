name: Scheduled Seshat data collection

on:
  schedule:
    - cron: "17 9,21 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: "mock = free; paid requires explicit repository opt-in and provider limits"
        type: choice
        options: [mock, paid]
        default: mock

permissions:
  contents: read

concurrency:
  group: seshat-scheduled-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      SESHAT_ENABLE_PAID_COLLECTION: ${{ vars.SESHAT_ENABLE_PAID_COLLECTION }}
      SESHAT_PROVIDER_BUDGET_CONFIRMED: ${{ vars.SESHAT_PROVIDER_BUDGET_CONFIRMED }}
      SESHAT_COLLECTION_PROVIDER: ${{ vars.SESHAT_COLLECTION_PROVIDER }}
      SESHAT_COLLECTION_MODEL: ${{ vars.SESHAT_COLLECTION_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data pipeline
        run: pip install -e ".[data,providers]"
      - name: Collect bounded batch
        run: |
          MODE="mock"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${SESHAT_ENABLE_PAID_COLLECTION:-false}" = "true" ]; then
            MODE="paid"
          fi
          python scripts/scheduled_collect.py --mode "$MODE" --output-dir "data/scheduled/$(date -u +%Y%m%dT%H%M%SZ)"
      - name: Preserve batch outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seshat-collection-${{ github.run_id }}
          path: data/scheduled/
          if-no-files-found: warn
          retention-days: 90
