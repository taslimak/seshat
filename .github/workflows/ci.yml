name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,data,providers]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test (live provider tests stay skipped; no API keys in CI)
        run: pytest --cov=seshat --cov-report=term
      - name: Offline pipeline smoke test (mock providers, no API spend)
        run: |
          seshat-data generate --count 120 --seed 42
          seshat-data collect --config configs/data_collection.yaml --dry-run
          seshat-data collect --config configs/data_collection.yaml
          seshat-data collect --config configs/data_collection.yaml   # resume: dispatches nothing
          seshat-data validate
          seshat-data export --format csv
          if seshat-data prepare-training --version ci; then
            echo "mock data must not produce a real-label dataset" && exit 1
          fi
          seshat-data prepare-training --version ci --label-origin synthetic
          seshat-data stats
          seshat-data predict
          seshat-data compare
      - name: Consolidation smoke test (fixture store; real stores refuse mock data)
        run: |
          seshat-data consolidate --source data --store /tmp/fixture-store --store-kind fixture
          seshat-data consolidate --source data --store /tmp/fixture-store --store-kind fixture | grep -q already_imported
          if seshat-data consolidate --source data --store /tmp/real-store; then
            echo "a real store must refuse mock-provider experiments" && exit 1
          fi
          seshat-data readiness --root /tmp/fixture-store --markdown
      - name: Live collection is refused without a cost cap
        run: |
          if seshat-data collect --config configs/experiments/live_pilot.yaml --execute-live; then
            echo "live collection without --max-cost-usd must fail" && exit 1
          fi
