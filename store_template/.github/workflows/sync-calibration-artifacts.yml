name: Sync calibration artifacts

# Lives in the PRIVATE store repository. Imports seshat-calibration-* artifacts
# from the public taslimak/seshat repository into this store and commits them.
# Uses only the built-in GITHUB_TOKEN: no personal access token, no secrets,
# no provider API calls, no spend. (Private-repo Actions minutes count against
# the account's free allowance; a sync takes ~2-3 minutes.)

on:
  push:
    branches: [main]
    paths: [".github/workflows/sync-calibration-artifacts.yml", "SESHAT_REF", "SYNC_REQUEST"]
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Optional space-separated taslimak/seshat run IDs (default: recent successful calibration runs)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: seshat-store-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPO: taslimak/seshat
      RUN_IDS: ${{ inputs.run_ids }}
    steps:
      - name: Refuse to run in a public repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "This store holds request messages; the repository must be private."
          exit 1

      - uses: actions/checkout@v4
        with:
          path: store

      - name: Resolve Seshat code revision
        id: ref
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < store/SESHAT_REF)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: taslimak/seshat
          ref: ${{ steps.ref.outputs.ref }}
          path: seshat

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Seshat
        run: python -m pip install -e "./seshat[data]"

      - name: Import new artifacts
        working-directory: seshat
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in $RUN_IDS; do
            case "$id" in (*[!0-9]*) echo "Invalid run id: $id"; exit 1 ;; esac
          done
          python scripts/sync_calibration_artifacts.py --store ../store \
            ${RUN_IDS:+--run-ids $RUN_IDS} | tee ../sync_summary.json

      - name: Decide whether the quality loop needs to run
        id: changed
        shell: bash
        run: |
          # Scheduled syncs that imported nothing leave the store untouched (no churn).
          imported=$(python -c "import json;d=json.load(open('sync_summary.json'));print(len(d.get('imported',[])))")
          if [ "$imported" != "0" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Forecast-quality loop (outcomes, snapshots, drift, run reports)
        if: steps.changed.outputs.run == 'true'
        working-directory: seshat
        run: python -m seshat.data.cli quality-refresh --root ../store | tee ../quality_summary.json

      - name: Train and register a challenger when justified (never activates it)
        if: steps.changed.outputs.run == 'true'
        working-directory: seshat
        shell: bash
        run: |
          set -euo pipefail
          due=$(python -c "import json;print(json.load(open('../store/quality/summary.json')).get('retraining',{}).get('due', False))")
          if [ "$due" = "True" ]; then
            python -m seshat.data.cli train-forecaster --root ../store \
              --output-dir ../challenger --register | tee ../challenger_summary.json
            python -m seshat.data.cli quality-refresh --root ../store > /dev/null
          else
            echo "No retraining: not enough new evidence"
          fi

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Store unchanged"; exit 0
          fi
          git commit -q -m "Sync artifacts + forecast quality (seshat@${{ steps.ref.outputs.ref }})" \
            -m "Sync run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push -q

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '```json'; cat sync_summary.json 2>/dev/null || true; echo '```'
            echo '```json'; cat store/quality/summary.json 2>/dev/null || true; echo '```'
            echo '```json'; cat challenger_summary.json 2>/dev/null || true; echo '```'
            cat store/reports/training_readiness.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
